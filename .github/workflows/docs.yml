name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'AGENTS.md'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Doxygen documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Doxygen
        env:
          DOXYGEN_VERSION: '1.18.0'
          DOXYGEN_SHA256: '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90'
        run: |
          doxygen_archive="$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz"
          curl --fail --location --retry 3 \
            "https://www.doxygen.nl/files/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz" \
            --output "$doxygen_archive"
          printf '%s  %s\n' "$DOXYGEN_SHA256" "$doxygen_archive" | sha256sum --check
          tar -xzf "$doxygen_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin/doxygen" --version

      - name: Generate documentation
        # Fail on any comment warning; the Doxyfile keeps NO so older local Doxygen still works.
        run: |
          mkdir -p build/doxygen
          ( cat Doxyfile; echo 'WARN_AS_ERROR = FAIL_ON_WARNINGS' ) | doxygen -
          test -s build/doxygen/html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/doxygen/html

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
